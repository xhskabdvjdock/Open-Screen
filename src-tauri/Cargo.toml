[package]
name = "open-screen"
version = "2.0.1"
description = "Open Screen — lightweight screenshot + editor + local OCR"
authors = ["Open Screen"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "fs", "process", "time", "macros", "io-util", "sync"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
xcap = "0.9"
active-win-pos-rs = "0.11"
arboard = "3"
base64 = "0.22"
chrono = { version = "0.4", features = ["clock"] }
uuid = { version = "1", features = ["v4"] }
dirs = "5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-manual-roots"] }
sysinfo = "0.30"
mp4 = "0.14"

[target.'cfg(windows)'.dependencies]
wasapi = "0.22"
windows-capture = "2.0"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Media_MediaFoundation",
  "Win32_System_Com",
] }

[features]
default = []
